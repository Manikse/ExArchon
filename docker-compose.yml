version: '3.8'

services:
  exarchon-core:
    build: .
    container_name: exarchon_nexus
    ports:
      - "8000:8000"
    env_file:
      - core/.env

    volumes:
      - ./core/kernel_workspace:/app/kernel_workspace
      - ./core/data:/app/data
      - exarchon_skills:/app/kernel_workspace/skills 
    volumes:
      exarchon_skills:
    restart: always