[workspace]
resolver = "2"
members = [
    "crates/cmg-core",
    "crates/cmg-storage",
    "crates/cmg-vm",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Manikse <pavloblaida@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/Manikse/ExArchon"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"